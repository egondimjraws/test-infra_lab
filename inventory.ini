[web]
vm ansible_host=host.docker.internal ansible_port=2222

[web:vars]
ansible_user=vagrant
ansible_ssh_private_key_file=/tmp/vagrant_key
ansible_python_interpreter=/usr/bin/python3
# Aceita a chave da VM no primeiro acesso e recusa se ela mudar depois.
ansible_ssh_common_args=-o StrictHostKeyChecking=accept-new
